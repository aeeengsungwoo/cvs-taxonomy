# 카테고리 트리. id는 부모 id + "." + 하위코드 (트리 유사도 계산에 그대로 쓰인다).
# 모든 노드에 definition 필수 — `python cvs.py validate` 가 빠진 정의를 잡아낸다.
- id: SNK
  name: 과자
  definition: 조리 없이 개봉 즉시 먹는 상온 유통 기호식품. 식사가 아니라 간식·안주·디저트 목적.
  children:
    - id: SNK.CHIP
      name: 칩
      definition: 얇은 판 형태로 튀기거나 구워 '바삭/파삭' 식감이 핵심인 스낵.
      children:
        - id: SNK.CHIP.POTATO
          name: 생감자칩
          definition: 생감자를 그대로 얇게 썰어 튀긴 칩. 감자 본연의 풍미와 불규칙한 모양이 특징.
        - id: SNK.CHIP.SHAPED
          name: 성형칩
          definition: 감자·곡물 가루 반죽을 일정한 모양으로 찍어 만든 칩. 모양·두께가 균일하다.
        - id: SNK.CHIP.GRAIN
          name: 곡물칩
          definition: 옥수수·통밀 등 곡물 반죽을 판·다층 형태로 만든 칩.
    - id: SNK.EXT
      name: 팽화·압출 스낵
      definition: 곡물 반죽을 고압에서 밀어내 부풀린(팽화) 스낵. 가볍고 입에서 부서지는 식감.
    - id: SNK.WHEAT
      name: 소맥 튀김 스낵
      definition: 밀가루 반죽을 성형해 튀긴 스낵. 새우·양파 등 시즈닝으로 맛을 낸다. 국내 스낵의 전통 축.
    - id: SNK.NUT
      name: 견과 스낵
      definition: 견과(주로 땅콩)가 핵심 원료이거나 견과를 반죽으로 감싼 스낵. 안주 성격이 강하다.
- id: BIS
  name: 비스킷·쿠키
  definition: 밀가루 반죽을 오븐에 구운 과자. 튀김이 아니라 '구움'이 공통 제조방식.
  children:
    - id: BIS.CRACKER
      name: 크래커
      definition: 당 함량이 낮고 담백·짭짤한 얇은 구운 과자. 단독 또는 다른 음식과 곁들여 먹는다.
    - id: BIS.COOKIE
      name: 쿠키
      definition: 버터·설탕 비중이 높아 단맛이 주가 되는 구운 과자. 초코칩 등 첨가물을 넣는 경우가 많다.
    - id: BIS.WAFER
      name: 웨하스·롤
      definition: 아주 얇게 구운 반죽을 겹치거나 말아 크림을 넣은 과자. 가볍게 부서지는 식감.
    - id: BIS.STICK
      name: 스틱
      definition: 막대 모양 비스킷에 초콜릿 등을 입힌 과자. 한 손으로 집어 먹는 형태가 핵심.
    - id: BIS.SANDWICH
      name: 샌드
      definition: 비스킷 두 장 사이에 크림을 넣은 과자.
    - id: BIS.CHOUX
      name: 슈볼
      definition: 속이 빈 작은 슈 반죽을 구워 크림을 채운 과자.
- id: CAKE
  name: 파이·케이크
  definition: 부드러운 케이크 시트(빵에 가까운 식감)에 크림·마시멜로 등을 넣고 개별포장한 과자.
  children:
    - id: CAKE.CHOCO
      name: 초코 코팅 케이크
      definition: 겉면을 초콜릿으로 코팅한 케이크형 과자.
    - id: CAKE.PLAIN
      name: 비코팅 케이크
      definition: 초콜릿 코팅 없이 시트 자체의 맛(커스터드·버터 등)이 중심인 케이크형 과자.
- id: CHO
  name: 초콜릿
  definition: 카카오(초콜릿)가 주성분이고 녹는 식감이 중심인 과자.
  children:
    - id: CHO.BAR
      name: 판·바 초콜릿
      definition: 판형이나 막대형으로 성형한 초콜릿. 퍼프·견과·캐러멜 등이 섞이기도 한다.
- id: CDY
  name: 캔디·젤리·껌
  definition: 당류를 굳히거나 졸여 만든 과자. 씹거나 녹여 먹으며 오래 입에 머문다.
  children:
    - id: CDY.JELLY
      name: 젤리
      definition: 젤라틴·펙틴 등으로 굳혀 탄력 있게 씹히는 과자.
    - id: CDY.CHEWY
      name: 츄잉캔디
      definition: 씹으면 늘어나며 녹는 말랑한 캔디. 과일맛·새콤한맛이 주류.
    - id: CDY.GUM
      name: 껌
      definition: 삼키지 않고 씹기만 하는 과자. 입가심·구취 제거 목적이 강하다.
- id: RMN
  name: 라면
  definition: 건조·유탕 처리한 면과 스프로 구성되어 물·열을 가해 조리하는 즉석 면류. 식사(대용)가 주 목적.
  children:
    - id: RMN.SOUP
      name: 국물라면
      definition: 국물과 함께 먹는 라면. 국물 맛이 제품 정체성의 중심.
      children:
        - id: RMN.SOUP.SPICY
          name: 얼큰 국물
          definition: 고추·마늘 베이스의 빨간 국물 라면.
        - id: RMN.SOUP.MILD
          name: 순한·하얀 국물
          definition: 고추 맛이 약하거나 없는, 사골·곰탕 계열 맑은/하얀 국물 라면.
        - id: RMN.SOUP.SEAFOOD
          name: 해물·짬뽕 국물
          definition: 해물 풍미가 중심인 국물 라면. 짬뽕류 포함.
        - id: RMN.SOUP.UDON
          name: 우동
          definition: 가쓰오·간장 베이스 국물과 굵은 면의 우동형 라면.
    - id: RMN.DRY
      name: 국물없는 라면
      definition: 면을 삶은 뒤 물을 버리고 소스에 비비거나 볶아 먹는 라면.
      children:
        - id: RMN.DRY.JJAJANG
          name: 짜장
          definition: 춘장 소스로 비비는 라면.
        - id: RMN.DRY.FRIED
          name: 볶음
          definition: 매운 양념 소스로 볶듯이 비비는 라면.
        - id: RMN.DRY.BIBIM
          name: 비빔
          definition: 찬물에 헹군 면을 새콤달콤한 초고추장 소스에 비벼 차게 먹는 라면.
- id: BEV
  name: 음료
  definition: 마시는 상품. 갈증해소·각성·식사곁들임·음주 등 마시는 목적이 정체성을 가른다.
  children:
    - id: BEV.CARB
      name: 탄산음료
      definition: 탄산이 들어간 청량음료.
      children:
        - id: BEV.CARB.COLA
          name: 콜라
          definition: 콜라 향의 갈색 탄산음료.
        - id: BEV.CARB.CIDER
          name: 사이다
          definition: 레몬·라임 향의 투명 탄산음료.
    - id: BEV.COFFEE
      name: 커피
      definition: 커피 추출액이 주원료인 음료. 각성이 주 목적.
      children:
        - id: BEV.COFFEE.BLACK
          name: 블랙커피
          definition: 당·우유 없이 커피 맛이 중심인 아메리카노류.
        - id: BEV.COFFEE.SWEET
          name: 믹스·캔커피
          definition: 설탕·크림이 들어간 단 캔커피.
        - id: BEV.COFFEE.LATTE
          name: 라떼·컵커피
          definition: 우유가 들어간 라떼류. 주로 컵 용기.
    - id: BEV.MILK
      name: 우유
      definition: 우유가 주원료인 음료.
      children:
        - id: BEV.MILK.WHITE
          name: 흰우유
          definition: 가공하지 않은 흰 우유.
        - id: BEV.MILK.FLAVOR
          name: 가공우유
          definition: 바나나·초코 등 맛을 더한 우유.
    - id: BEV.SPORTS
      name: 이온음료
      definition: 수분·전해질 보충용 음료.
    - id: BEV.TEA
      name: 차음료
      definition: 보리·옥수수수염 등을 우린 무가당 차.
    - id: BEV.WATER
      name: 생수
      definition: 마시는 물.
    - id: BEV.ENERGY
      name: 에너지드링크
      definition: 카페인·타우린 함량이 높은 각성 음료.
    - id: BEV.FUNC
      name: 숙취해소음료
      definition: 음주 전후 숙취 완화를 내세운 기능성 음료.
    - id: BEV.JUICE
      name: 주스
      definition: 과즙이 주원료인 음료.
    - id: BEV.ALC
      name: 주류
      definition: 알코올 음료. 성인만 구매 가능하고 추천 제한 정책(restricted)을 받는다.
      children:
        - id: BEV.ALC.BEER
          name: 맥주
          definition: 맥아를 발효한 탄산 주류.
        - id: BEV.ALC.SOJU
          name: 소주
          definition: 희석식 소주.
        - id: BEV.ALC.MAKGEOLLI
          name: 막걸리
          definition: 쌀을 발효한 탁주.
- id: HOU
  name: 생필품
  definition: 먹지 않는 일상 소모품. 맛·식감 축이 없고 용도·규격이 정체성이며, 편의점에서는 갑자기 필요해서 사는 긴급 구매가 중심.
  children:
    - id: HOU.PAPER
      name: 화장지·티슈
      definition: 닦는 데 쓰는 종이 제품.
      children:
        - id: HOU.PAPER.DRY
          name: 화장지·각티슈
          definition: 마른 종이 티슈.
        - id: HOU.PAPER.WET
          name: 물티슈
          definition: 물기를 머금은 티슈.
    - id: HOU.ORAL
      name: 구강용품
      definition: 이·입을 관리하는 용품.
      children:
        - id: HOU.ORAL.BRUSH
          name: 칫솔
          definition: 이를 닦는 솔.
        - id: HOU.ORAL.PASTE
          name: 치약
          definition: 칫솔에 묻혀 쓰는 세정제.
        - id: HOU.ORAL.KIT
          name: 휴대용 칫솔세트
          definition: 칫솔과 치약을 한 케이스에 담은 여행용 세트.
        - id: HOU.ORAL.RINSE
          name: 구강청결제
          definition: 입을 헹구는 가글액.
    - id: HOU.SHAVE
      name: 면도용품
      definition: 면도에 쓰는 용품.
      children:
        - id: HOU.SHAVE.RAZOR
          name: 면도기
          definition: 수동 면도기.
        - id: HOU.SHAVE.FOAM
          name: 쉐이빙폼
          definition: 면도 전 바르는 거품.
    - id: HOU.FEM
      name: 생리용품
      definition: 생리대 등 생리 위생용품. 크기 규격이 맞아야 대체 가능.
    - id: HOU.BATTERY
      name: 건전지
      definition: 일회용 건전지. 크기 규격(AA/AAA)이 맞아야 대체 가능.
    - id: HOU.MASK
      name: 마스크
      definition: 보건용 마스크.
    - id: HOU.RAIN
      name: 우산
      definition: 갑작스런 비에 사는 우산.
