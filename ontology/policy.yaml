# 추천 정책. 점수(유사도)는 '얼마나 비슷한가'만 말하고, 정책은 '사람이라면 이걸 추천하겠는가'를 막는다.
# 정책은 하드 조건이다 — 점수가 아무리 높아도 정책을 어기면 간선을 만들지 않는다(튀는 추천 방지).
# 사람이 검수 O 한 쌍이 정책에 걸리면 간선을 만들지 않고 out/audit.md 의 '정책 충돌'에 올린다
# → 정책이 틀렸는지 검수가 틀렸는지 사람이 정한다.
# 조건 문법(matches): {속성: 값 또는 [값...]} AND 결합. 카테고리는 접두어 일치(CHO → CHO.BAR).

# 아이덴티티: 상품이 '무엇'인가를 가르는 키. 같은 키 = 같은 정체성 = 손님 입장에서 같은 종류.
identity:
  snack: {category_level: 2}       # SNK.CHIP / BIS.COOKIE / CHO.BAR
  ramen: {attrs: [style]}          # 국물 / 짜장 / 볶음 / 비빔
  beverage: {category_level: 2}    # BEV.CARB / BEV.COFFEE / BEV.MILK / BEV.ALC
  household: {category_level: 3}  # HOU.ORAL.BRUSH / HOU.ORAL.PASTE — 칫솔과 치약은 정체성이 달라야 보완재가 된다
  definition: >-
    손님이 '같은 종류'라고 느끼는 단위. 과자·음료는 카테고리 2단계, 라면은 조리형태,
    생필품은 카테고리 3단계(용도 안의 품목). 보완재·콤보는 서로 다른 정체성끼리만 묶는다.

# 상품간 정책 1 — 대체재: 이게 없을 때 저걸 사도 같은 욕구가 채워지는가. 같은 type 안에서만.
substitute:
  definition: 같은 욕구를 채우는 다른 상품. 같은 type, 같은 목적, 같은 규격대여야 한다.
  snack: {category_level: 1, share: [occasion]}      # 대분류 같고 구매상황 겹침
  # 조리형태·포장형태 같음 (국물↔짜장, 봉지↔컵 대체 금지 — 2차 검수에서 추가)
  # 설문: 같은 라인이면 봉지 ↔ 큰컵 4쌍 모두 O (불닭 → 불닭 큰컵 100%, 신라면 → 신라면 큰사발 71%) — 다른 라인 작은컵 → 봉지는 5쌍 모두 X
  #   같은 메뉴(짜장)면 브랜드가 달라도 봉지 ↔ 큰컵 6쌍 모두 O (짜왕 → 짜파게티 큰사발 83%, 큰사발 → 짜짜로니 85%)
  ramen: {same: [style, container], same_unless_line: [container], same_unless_menu: [container], share: [occasion]}
  beverage: {category_level: 2, share: [occasion]}   # 탄산은 탄산끼리, 커피는 커피끼리
  # 같은 품목 + 규격 일치 (AA ↔ AAA 금지). 설문: 생리대 중형 ↔ 대형 ↔ 오버나이트는 4쌍 O (급할 땐 한 사이즈 차이는 산다)
  household: {category_level: 3, same: [spec], loose: {spec: [HOU.FEM]}}
  # 규격 정책: 순서 속성의 허용 최대 단계 차이.
  #   가격대·용량 1단계 — 1,500원 과자 대신 5,000원 박스를 권하지 않는다
  #   맵기 1단계 — 신라면(중) 대신 사리곰탕(없음)을 권하지 않는다 (3차 검수에서 2→1)
  #   알코올 0단계 — 맥주 대신 소주를 권하지 않는다
  max_gap: {price_band: 1, size: 1, abv: 0}
  # 포함 정책: 세트는 그 구성품을 대신할 수 있다(칫솔 품절 → 여행용 칫솔치약 세트). 반대(세트 → 칫솔만)는 구성품이 빠지므로 안 된다.
  # 설문: 세트 품절 → 칫솔·치약 낱개도 97% O. 처음 정한 '반대는 안 됨'을 뒤집어 양방향으로
  includes:
    - {set: HOU.ORAL.KIT, covers: [HOU.ORAL.BRUSH, HOU.ORAL.PASTE], two_way: true}
  # 묶음: 카테고리는 다르지만 손님이 같은 욕구로 보는 것 (설문 2쌍 이상 O)
  #   물 ↔ 무가당 차 8쌍 모두 O (50~83%) · 빼빼로 → 초코바 3쌍 O (78~83%) · 화장지·각티슈 → 물티슈 2쌍 O
  groups:
    - {name: 갈증 해소 음료, cats: [BEV.WATER, BEV.TEA]}
    - {name: 초코 간식, cats: [BIS.STICK, CHO.BAR]}
    - {name: 휴지류, cats: [HOU.PAPER.DRY, HOU.PAPER.WET]}
    # 택소노미 적합도(cvs.py taxofit): 감자칩 ↔ 압출 8/9 · 압출 ↔ 소맥 6/8 · 소맥 ↔ 견과 6/8 O — 손님은 원료·제법보다 '짭짤한 봉지 과자'로 본다
    #   트리(원료·제법)는 진열·발주 공통 언어로 그대로 두고, 대체용으로만 묶는다. 홀드아웃 1순위 0.879 → 0.890, 헛추천 0.174 → 0.169
    - {name: 짭짤한 봉지 스낵, cats: [SNK.CHIP, SNK.EXT, SNK.WHEAT, SNK.NUT]}
  # 방향 정책: 찾는 상품 → 권할 상품 방향에 따라 허용 단계가 다르다. up = 값이 커지는 쪽(당 많아짐·더 매움·카페인 많아짐).
  #   당      up 1 — 단, 제로·저당(없음·적음)을 고른 손님에게 당이 더 많은 것은 절대 금지 (hard_from, 건강 제약, 관리자 질문 없음)
  #           down 3 — 코카콜라 → 코카콜라 제로는 허용하되 강도 감점. 매장마다 다를 수 있어 관리자에게 정책 1문항으로 묻는다
  #   맵기    up 1 · down 1 — 한 단계까지. 더 매운 쪽은 감점. '약'까지 올라가는 것(새우깡 → 먹태깡 청양마요)은 방향 정책 대상 아님(free_up_to)
  #   카페인  up 1 — 한 단계(사이다 → 콜라)는 감점 허용, 디카페인 → 일반 커피처럼 큰 차이는 금지
  # ask 가 있는 방향은 관리자 질문으로 확정한다(review/admin_queue.csv). 답이 X면 그 방향 허용 단계가 0이 된다.
  direction:
    # 설문: 같은 라인 안의 당 올림은 O (코카콜라 제로 → 코카콜라 70%, 칠성 제로 → 칠성 72%, 더블랙 → 스위트 57%), 다른 라인은 X
    #   단 다이어트·당뇨 응답자는 전원 X → 허용하되 감점하고 점원 순서 맨 뒤 (같은 제로 상품이 있으면 그게 먼저)
    sugar:    {up: 1, hard_from: [없음, 적음], line_free: true, down: 3, penalty: {down: 0.15, up: 0.15}, ask: {down: "당 높은 상품 → 제로·저당 상품 대체 허용 (예: 코카콜라 → 코카콜라 제로)"}}
    # 설문: 이미 매운 것(중 이상)을 고른 손님에게 더 매운 것은 5쌍 모두 O (까르보 → 불닭 87%) → free_from: 중
    spicy:    {up: 1, free_up_to: 약, free_from: 중, down: 1, penalty: {up: 0.1}, ask: {up: "덜 매운 상품 → 한 단계 더 매운 상품(중 이상) 대체 허용 (예: 진라면 순한맛 → 진라면 매운맛)"}}
    caffeine: {up: 1, down: 3, penalty: {up: 0.1}}

# 상품간 정책 2 — 보완재: 같이 사면 가치가 커지는가. type을 넘나들 수 있다.
complement:
  definition: 함께 소비할 때 가치가 커지는 다른 정체성의 상품. 같은 시간대에 쓸 수 있어야 한다.
  forbid_same_identity: true   # 포카칩+수미칩은 보완이 아니라 대체
  require_overlap: [time]      # 추론된 시간대가 하나도 안 겹치면 보완 아님. 시간대가 없는 상품(생필품)은 중립
  pairs:   # 사람이 아는 조합. strength 는 사람이 정한 값
    - {a: R13, b: R07, strength: 0.9, reason: 짜파구리(짜파게티+너구리)}
    - {a: R14, b: R11, strength: 0.6, reason: 불닭 맵기 중화용 순한 국물}
    - {a: R14, b: B10, strength: 0.7, reason: 불닭 + 우유}
    - {a: S31, b: B10, strength: 0.6, reason: 초코파이 + 우유}
    - {a: H04, b: H05, strength: 0.9, reason: 칫솔 + 치약}
    - {a: H08, b: H09, strength: 0.85, reason: 면도기 + 쉐이빙폼}
  rules:   # 속성 조건으로 만드는 가설. 강도를 낮게 두고 검수로 올린다
    - name: 안주 스낵 + 맥주
      a: {type: snack, occasion: 술안주}
      b: {category: BEV.ALC.BEER}
      strength: 0.5
    - name: 야식 라면 + 소주
      a: {type: ramen, occasion: 야식}
      b: {category: BEV.ALC.SOJU}
      strength: 0.4
    - name: 매운 라면 + 우유
      a: {type: ramen, spicy: [중, 강, 극강]}
      b: {category: BEV.MILK}
      strength: 0.45
    - name: 라면 + 탄산
      a: {type: ramen}
      b: {category: BEV.CARB}
      strength: 0.35
    - name: 디저트 과자 + 커피
      a: {type: snack, occasion: 디저트}
      b: {category: BEV.COFFEE}
      strength: 0.45
    - name: 초코 과자 + 흰우유
      a: {type: snack, flavor: 초코}
      b: {category: BEV.MILK.WHITE}
      strength: 0.45
    - name: 짠 간식 + 탄산
      a: {type: snack, occasion: 간식, flavor: 짠맛}
      b: {category: BEV.CARB}
      strength: 0.3
    - name: 해장 라면 + 해장 음료
      a: {type: ramen, occasion: 해장}
      b: {category: [BEV.FUNC, BEV.SPORTS]}
      strength: 0.4
    - name: 국물 라면 + 막걸리
      a: {type: ramen, style: 국물}
      b: {category: BEV.ALC.MAKGEOLLI}
      strength: 0.35
    - name: 술 + 숙취해소
      a: {category: BEV.ALC}
      b: {category: BEV.FUNC}
      strength: 0.5
    - name: 매운 라면 뒤 단 디저트
      a: {type: ramen, spicy: [중, 강, 극강]}
      b: {type: snack, occasion: 디저트}
      strength: 0.3
    - name: 라면 뒤 입가심
      a: {type: ramen}
      b: {type: snack, occasion: 입가심}
      strength: 0.25
    - name: 외박 세면 키트
      a: {type: household, occasion: 외박·여행}
      b: {type: household, occasion: 외박·여행}
      strength: 0.4

# 상품간 정책 3 — 제한 상품: 어떤 점수·규칙으로도 함께 추천하지 않는 조합.
restricted:
  - name: 주류 × 어린이 상품
    definition: 주류는 어린이 대상 상품과 보완재·콤보로 묶지 않는다.
    items: {category: BEV.ALC}
    never_with: {target: 어린이}

# 콤보: 장면(ontology/tpo.yaml scenes)마다 슬롯을 채운 상품 묶음.
combo:
  definition: 한 TPO 장면에서 함께 사는 상품 묶음. 장면 TPO에 맞고, 정체성이 겹치지 않고, 제한 정책을 지키고, 예산 안이어야 한다.
  price: {"~1500": 1200, "1500~2500": 2000, "2500~4000": 3200, "4000~": 5000}   # 가격대 대표가(원)
  distinct_identity: true
  top: 5          # 장면당 콤보 수
  max_reuse: 2    # 한 상품이 한 장면의 상위 콤보에 최대 몇 번 등장하나 (다양성)

# 트렌드: data/trends.csv (판매·검색 급상승 등 외부 신호). 트렌드도 정책을 통과한 것만 추천한다.
trend:
  definition: 특정 기간에 판매·검색이 평소보다 뜬 상품. TPO 적합성·정책을 통과해야 추천에 쓰인다.
  min_score: 0.3

# 상품간 정책 4 — 앵커(대체 기준): 대체재를 찾을 때 손님이 '놓지 않으려는 것'.
# 예) 불닭볶음면 큰컵 → 라인(불닭)을 놓지 않음 → 까르보불닭 큰컵이 1순위
#     오모리 김치찌개라면 → 브랜드(오모리)인지 메뉴(김치)인지 데이터만으로 못 정함 → 사람이 정한다
# 앵커는 하드 정책(아이덴티티·규격·제한) 안에서만 순위를 올린다. 정책을 뚫지 못한다(코카콜라 → 코카콜라 제로는 여전히 금지).
anchor:
  definition: 대체재 순위의 기준. line(브랜드 라인) / menu(대표 메뉴) / category(기본 — 속성 유사도만) 중 하나를 상품마다 정한다.
  boost: 0.25   # 앵커 값이 같은 후보의 유사도에 더하는 값(최대 1.0)
  # 자동 판정 규칙 (cvs.py anchor 가 위에서부터 적용, 결과는 review/anchor.csv)
  #   후보 = 같은 type 이면서 하드 정책을 통과한 상품
  #   1. line·menu 둘 다 있으면                                       → pending (사람이 정함, 후보 목록을 같이 보여줌)
  #   2. line 이 같은 후보가 있으면                                    → line (auto)
  #   3. menu 가 같은 후보가 있으면                                    → menu (auto)
  #   4. 그 외                                                        → category (auto)
  # 사람 결정: review/anchor.csv 의 decision 칸에 line / menu / category 를 쓰면 자동 판정보다 우선.
  # pending 이 남아 있는 동안은 category 로 동작한다(앵커 가산 없음).

# 속성 영향도 판정 기준 (cvs.py impact → out/attribute_impact.csv)
# 속성 하나를 빼고(가중치 0) 다시 평가해서 성능 변화(Δ종합)와 추천 목록 변화(상위 5 변동률)를 잰다.
attribute_impact:
  keep_delta: 0.005      # 빼면 종합 점수가 이만큼 이상 떨어지면 → 유지(점수 기여)
  noise_delta: -0.005    # 빼면 종합 점수가 이만큼 이상 오르면 → 제거 권장(노이즈)
  churn_hold: 0.10       # 성능 변화는 없는데 상위 5 추천이 10% 이상 바뀌면 → 보류(정답셋이 못 재는 영향, 검수 필요)
  missing_warn: 0.30     # 결측률 30% 이상 → 데이터 보강 필요
  # 판정 순서: 정책·TPO에서 쓰임 → 유지(구조) / 현재 뎁스 밖 → 제거 후보(미사용) / 위 수치 규칙

# 구축 단계 자동 판정 + 관리자 HITL (cvs.py triage → review/auto_labels.csv · review/admin_queue.csv)
# 손님에게는 묻지 않는다. 비슷한 검수 쌍이 충분하면 자동 판정하고, 근거가 부족하거나 엇갈리는 것만 관리자에게 묻는다.
hitl:
  candidates_k: 5        # 상품당 벡터 근처 후보 수
  similar_cutoff: 0.8    # 검수된 쌍 (c→d) 가 (a→b) 와 비슷하다고 볼 기준: cos(a,c) × cos(b,d)
  min_support: 1.5       # 비슷한 검수 쌍의 유사도 합이 이 이상이어야 자동 판정
  approve: 0.8           # 비슷한 검수 쌍 중 O 비율(가중) 이상 → 자동 승인
  reject: 0.2            # 이하 → 자동 거절
  min_score: 0.55        # 이보다 유사도가 낮은 후보는 묻지도 않음
  max_questions: 15      # 관리자에게 한 번에 묻는 상품쌍 수 (불확실한 순)
  auto_strength: {base: 0.45, slope: 0.4}   # 자동 승인 간선 강도 = 0.45 + 0.4 × 유사도 (사람 검수 O 보다 낮게)

# 품절 대체 추천 (cvs.py oos) — 점원처럼: 방향 있는 대체 간선을 강도순으로, 다른 품절·지금 상황(TPO)에 안 맞는 것은 빼고,
# 기준 미만이면 억지로 권하지 않는다("권할 대체 없음"). 이유는 같은 점 하나 + 다른 점 두 개까지.
oos:
  top: 3
  min_strength: 0.6
  # 순서: 같은 라인(당·맵기·카페인이 더 세지지 않는 쪽) → 같은 세부 카테고리 → 나머지, 같은 단계 안에서는 강도순
  # TPO: 대안이 지금 상황을 피하는 상품이면 빼되, 손님이 고른 상품도 그 상황을 피하면 손님 선택 우선
  group_tier: true   # 같은 묶음(groups)은 같은 세부 카테고리와 같은 순서로 본다
  quiet_flavors: [매운맛, 짠맛, 감칠맛, 고소한맛, 고기]   # 이유에 굳이 말하지 않는 흔한 맛

# 페르소나 설문(survey/) 판정 기준. 응답자 = 그 상품을 살 일이 있는 사람(skip 제외)
#   min_n 명 이상 답한 보기만 판정, accept 이상이 '대신 산다' → O, reject 이하 → X, 사이는 갈림
# split: 설문이 갈린 쌍(reject < 수용 < accept)의 처리. ai = 옛 AI 라벨 유지, weak = 수용률을 약한 강도로, none = AI 라벨을 버리고 벡터 점수(미검수 할인)로
#   홀드아웃(짝수 채점) 헛추천 ai 0.155 · weak 0.175 · none 0.144, 선택률은 셋 다 0.94 → none
survey: {min_n: 5, accept: 0.5, reject: 0.2, split: none}
# 증류 모델(cvs.py distill): 설문 판정으로 '대신 살 확률'을 학습해, 설문 없는 쌍을 판정한다. 확신 구간 밖(reject < p < accept)은 판정하지 않고 선별 설문으로 보낸다.
#   새 상품 가정(상품 3겹, AI 라벨 없음) 선택률 0.831 → 0.870 · 1순위 0.766 → 0.808 · 빈손 0.132 → 0.101 (기준 0.55/0.3이 가장 좋음)
distill: {enabled: true, accept: 0.55, reject: 0.3, override_ai: true}
