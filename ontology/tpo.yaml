# TPO(Time·Place·Occasion) 온톨로지.
# 사람이 상품마다 TPO를 찍지 않는다. 상품 속성 → TPO 추론 규칙으로 유도해서, 새 상품도 속성만 채우면 TPO가 따라온다.
# 섭취상황(occasion)은 taxonomy/schema.yaml 에 이미 있으므로 여기서는 시간·장소·날씨 차원을 정의한다.
dimensions:
  time:
    name: 시간대
    definition: 구매·섭취가 일어나는 시간대.
    values:
      아침: {definition: "06~10시. 출근·등교길, 해장."}
      점심: {definition: "11~14시. 식사와 식후 디저트."}
      오후: {definition: "14~18시. 간식 시간."}
      저녁: {definition: "18~22시. 식사·반주."}
      심야: {definition: "22~02시. 야식·혼술."}
  place:
    name: 장소
    definition: 상품을 먹는 장소. 조리 도구·나눔 여부를 결정한다.
    values:
      집: {definition: 냄비·전자레인지가 있고 혼자 또는 가족과 먹는다.}
      사무실·학교: {definition: 뜨거운 물 정도만 있고 냄비 조리는 불가. 동료와 나눠 먹는다.}
      야외·캠핑: {definition: 버너가 있을 수 있고 여럿이 나눠 먹는다. 날씨 영향을 받는다.}
      이동중: {definition: 걸으면서·차 안에서 한 손으로 먹는다. 조리 불가.}
  weather:
    name: 날씨
    definition: 구매 결정에 영향을 주는 날씨.
    values:
      더움: {definition: 한여름. 시원한 음식 선호, 초콜릿이 녹는다.}
      추움: {definition: 한겨울. 뜨거운 국물 선호.}
      비: {definition: 비 오는 날. 국물·전 계열 선호.}

# 추론 규칙. when 조건(AND, 값 목록은 OR)을 만족하면 then 의 TPO를 붙이고 exclude 의 TPO는 뺀다.
# exclude 는 then 보다 우선한다(어떤 규칙에서 붙었든 지운다).
# 상품에 어떤 차원 값이 하나도 안 붙으면 그 차원은 '중립'(어떤 장면에도 막히지 않음).
rules:
  - {when: {occasion: 술안주}, then: {time: [저녁, 심야], place: [집, 야외·캠핑]}}
  - {when: {occasion: 야식}, then: {time: [심야], place: [집]}}
  - {when: {occasion: 식사대용}, then: {time: [점심, 저녁], place: [집, 사무실·학교]}}
  - {when: {occasion: 간식}, then: {time: [오후], place: [집, 사무실·학교, 이동중]}}
  - {when: {occasion: 디저트}, then: {time: [점심, 저녁]}}
  - {when: {occasion: 나눔}, then: {place: [사무실·학교, 야외·캠핑]}}
  - {when: {occasion: 해장}, then: {time: [아침, 점심]}}
  - {when: {occasion: 입가심}, then: {time: [점심, 저녁], place: [사무실·학교, 이동중]}}
  - {when: {container: [작은컵, 큰컵]}, then: {place: [사무실·학교, 야외·캠핑]}}
  - {when: {container: 봉지}, then: {place: [야외·캠핑]}, exclude: {place: [사무실·학교, 이동중]}}
  - {when: {style: 국물}, then: {weather: [추움, 비]}, exclude: {weather: [더움]}}
  - {when: {style: 비빔}, then: {weather: [더움]}, exclude: {weather: [추움]}}
  - {when: {texture: 녹는}, exclude: {weather: [더움]}}
  - {when: {shape: 개별케이크}, then: {place: [사무실·학교, 이동중]}}

# 장면(scene) = 콤보 추천이 일어나는 TPO 상황. slots 는 장면을 채우는 역할과 조건(matches 문법).
scenes:
  - id: late_night_solo
    name: 심야 혼술·야식
    tpo: {time: 심야, place: 집}
    budget: 5000
    slots:
      - {role: 메인, cond: {type: ramen}}
      - {role: 안주, cond: {type: snack, occasion: 술안주}}
  - id: office_lunch_cup
    name: 사무실 점심 컵라면
    tpo: {time: 점심, place: 사무실·학교}
    budget: 5000
    slots:
      - {role: 메인, cond: {type: ramen, container: [작은컵, 큰컵]}}
      - {role: 후식, cond: {type: snack, occasion: 디저트}}
  - id: office_share
    name: 오후 사무실 나눔 간식
    tpo: {time: 오후, place: 사무실·학교}
    budget: 8000
    slots:
      - {role: 나눔, cond: {type: snack, occasion: 나눔}}
      - {role: 곁들임, cond: {type: snack, occasion: 간식}}
  - id: camping_night
    name: 캠핑 저녁
    tpo: {time: 저녁, place: 야외·캠핑}
    budget: 10000
    slots:
      - {role: 메인, cond: {type: ramen, container: 봉지}}
      - {role: 안주, cond: {type: snack, occasion: 술안주}}
      - {role: 나눔, cond: {type: snack, occasion: 나눔}}
  - id: hot_day_lunch
    name: 더운 날 점심
    tpo: {time: 점심, weather: 더움}
    budget: 5000
    slots:
      - {role: 메인, cond: {type: ramen}}
      - {role: 후식, cond: {type: snack, occasion: 디저트}}
  - id: rainy_evening
    name: 비 오는 날 저녁
    tpo: {time: 저녁, weather: 비}
    budget: 6000
    slots:
      - {role: 메인, cond: {type: ramen, style: 국물}}
      - {role: 곁들임, cond: {type: snack}}
