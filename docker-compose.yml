# 로컬 Neo4j. 띄운 뒤: http://localhost:7474 (neo4j / cvs-taxonomy)
#   NEO4J_PASSWORD=cvs-taxonomy python cvs.py graph --push
# 또는 Browser 에 out/graph.cypher 내용을 붙여넣어 실행.
services:
  neo4j:
    image: neo4j:5-community
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/cvs-taxonomy
    volumes: ["neo4j-data:/data"]
volumes:
  neo4j-data:
