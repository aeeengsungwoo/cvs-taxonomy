# 보완재 = 같이 사면 가치가 커지는 조합. 대체재(서로 바꿔 사는 것)와 정반대 관계라 따로 정의한다.
# pairs : 알려진 조합을 직접 지정. strength 는 사람이 정한 값.
# rules : 속성 조건으로 조합을 생성. 가설 수준이라 strength 를 낮게 두고 검수로 올린다.
#         조건은 {속성: 값} — 상품이 그 값을 가지면 매칭(multi 속성은 포함 여부).
pairs:
  - {a: R13, b: R07, strength: 0.9, reason: 짜파구리(짜파게티+너구리)}
  - {a: R14, b: R11, strength: 0.6, reason: 불닭 맵기 중화용 순한 국물}
rules:
  - name: 매운 라면 뒤 단 디저트
    a: {type: ramen, spicy: [중, 강, 극강]}
    b: {type: snack, occasion: 디저트}
    strength: 0.35
  - name: 라면 뒤 입가심
    a: {type: ramen}
    b: {type: snack, occasion: 입가심}
    strength: 0.3
  - name: 야식 라면 + 안주 스낵
    a: {type: ramen, occasion: 야식}
    b: {type: snack, occasion: 술안주}
    strength: 0.25
